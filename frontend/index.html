<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuadTecho - 学生風手帳サイト</title>
  <meta name="description" content="付箋やシールで自由にデコレーションできる、シンプルで使いやすい学生風手帳サイト。手帳の管理・共有掲示板・サークル機能を備えています。" />
  <meta name="theme-color" content="#22313f" />
  <!-- サイトアイコン: OGP画像(assets/ogp.png)内のアプリアイコンを正方形に切り出して生成
       （再生成は python3 tools/make_site_icons.py / 48の倍数サイズを用意してGoogleにも拾わせる） -->
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/icons/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="./assets/icons/favicon-96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />

  <!-- OGP / Twitterカード
       公開URLが変わったら og:url と og:image / twitter:image を書き換える -->
  <link rel="canonical" href="https://plan.wawa-app.me/QuadTecho/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="QuadTecho" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:title" content="QuadTecho - 学生風手帳サイト" />
  <meta property="og:description" content="付箋やシールで自由にデコレーションできる、シンプルで使いやすい学生風手帳サイト。" />
  <meta property="og:url" content="https://plan.wawa-app.me/QuadTecho/" />
  <meta property="og:image" content="https://plan.wawa-app.me/QuadTecho/assets/ogp.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="QuadTecho - 毎日を、わたしの一冊に。" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="QuadTecho - 学生風手帳サイト" />
  <meta name="twitter:description" content="付箋やシールで自由にデコレーションできる、シンプルで使いやすい学生風手帳サイト。" />
  <meta name="twitter:image" content="https://plan.wawa-app.me/QuadTecho/assets/ogp.png" />
  <meta name="twitter:image:alt" content="QuadTecho - 毎日を、わたしの一冊に。" />

  <!-- Google Search Console（所有権確認）
       プロパティ: https://plan.wawa-app.me/QuadTecho/ （URL プレフィックス）
       下の content が Search Console で発行された確認トークン（設定済み）。
       プロパティを作り直した場合のみ、表示された content="..." の値へ差し替える。
       ※ HTML ファイル方式を使う場合は、発行された google<ID>.html を
         この index.html と同じディレクトリ（公開URL直下）に置く -->
  <meta name="google-site-verification" content="QEND1wFNaZp1AQkewXw8BQcRELQNfWwU_W_G9aUs5XQ" />

  <!-- 検索エンジン向け: インデックス許可 ＆ 大きめの画像プレビューを許可 -->
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="googlebot" content="index, follow, max-image-preview:large" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Vue 3 は Vite がバンドルする（CDN からの読み込みは廃止）。
       開発は npm run dev / 公開用は npm run build でビルドする。 -->
  <!-- 配信中の画面はビルド成果物 (assets/app.css・assets/app.js)。
       ビルド時に ?v=<ビルド時刻> を付けて、キャッシュによる HTML と JS のずれを防ぐ -->

  <!-- 構造化データ: 検索結果にサイト名・アプリ情報を伝える（Google Search Console のリッチリザルト対象） -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://plan.wawa-app.me/QuadTecho/#website",
          "url": "https://plan.wawa-app.me/QuadTecho/",
          "name": "QuadTecho",
          "alternateName": "クアッド・テチョウ",
          "description": "付箋やシールで自由にデコレーションできる、シンプルで使いやすい学生風手帳サイト。",
          "inLanguage": "ja-JP"
        },
        {
          "@type": "WebApplication",
          "@id": "https://plan.wawa-app.me/QuadTecho/#webapp",
          "name": "QuadTecho",
          "url": "https://plan.wawa-app.me/QuadTecho/",
          "applicationCategory": "LifestyleApplication",
          "operatingSystem": "Web",
          "browserRequirements": "JavaScript が必要です（Chrome / Safari / Edge / Firefox の最新版）",
          "description": "付箋やシールで自由にデコレーションできる学生風の手帳サイト。手帳の管理・共有掲示板・サークル機能を備えています。",
          "image": "https://plan.wawa-app.me/QuadTecho/assets/ogp.png",
          "inLanguage": "ja-JP",
          "isAccessibleForFree": true,
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "JPY"
          }
        }
      ]
    }
  </script>
</head>

<body>
  <!-- JS が無効な環境（一部のクローラ・テキストブラウザ）向けの説明。
       Vue のマウント対象（#app）の外に置くことで、描画の邪魔をしない -->
  <noscript>
    <h1>QuadTecho（クアッド・テチョウ）</h1>
    <p>付箋やシールで自由にデコレーションできる、シンプルで使いやすい学生風の手帳サイトです。手帳の管理、共有掲示板、サークル（部活）機能を備えています。ご利用には JavaScript を有効にしてください。</p>
    <p><a href="https://plan.wawa-app.me/QuadTecho/">QuadTecho を開く</a></p>
  </noscript>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
